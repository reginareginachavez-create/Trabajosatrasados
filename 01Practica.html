<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <title>MI PRIMERA VEZ CON JAVASCRIPT</title>
</head>
<body>

<nav class="navbar fg-2 bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">
      <img src="img/logo.jpeg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
      PRACTICA 1 JAVASCRIPT
    </a>
  </div>
</nav>

<div class="container p-4">
    <div class="row">
        <div class="col">
            <button class="btn-subtle theme-warning my-3" onclick="mensaje1()"><i class="bi bi-check-circle"></i>Iniciar sesión</button>
            <button class="btn-outline theme-success my-3" onclick="mensaje2()"><i class="bi bi-exclamation-triangle-fill"></i>Advertencia</button>
            <button class="btn-solid theme-info my-3" onclick="mensaje3()"><i class="bi bi-x-circle"></i>Cancelar</button>
            <button class="btn-solid theme-danger my-3" onclick="mensaje4()"><i class="bi bi-trash"></i>Reciclar</button>
            <button class="btn-text theme-primary my-3" onclick="mensaje5()"><i class="bi bi-question-circle"></i>Confirmar ingreso</button>
        </div>
        <div class="col">
            <button class="btn-subtle theme-Inverse my-3" onclick="mensaje6()"><i class="bi bi-fingerprint"></i>Usar huella</button>
            <button class="btn-solid theme-secondary my-3" onclick="mensaje7()"><i class="bi bi-shield-lock"></i>Ingresar clave</button>
            <button class="btn-outline theme-accent my-3" onclick="mensaje8()"><i class="bi bi-incognito"></i>Modo incógnito</button>
            <button class="btn-outline theme-d my-3" onclick="mensaje9()"><i class="bi bi-search"></i>Filtrar resultados</button>
            <button class="btn-text theme-warning my-3" onclick="mensaje10()"><i class="bi bi-arrow-counterclockwise"></i>Limpiar búsqueda</button>
        </div>
    </div>
</div>

<div class="container p-4">
    <button class="btn-solid theme-danger" onclick="mensaje()"><i class="bi bi-trash-fill"></i>Eliminar</button>
</div>

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/sweetalert2.all.min.js"></script>
<script>
    function mensaje(){
        Swal.fire({
            title: "¡Éxito!",
            text: "Se ejecutó correctamente el script",
            icon: "success"
        });
    }
    function mensaje1(){
        Swal.fire({
            title: "Iniciar sesión",
            text: "Iniciaste sesión correctamente",
            icon: "success"
        });
    }
    function mensaje2(){
    Swal.fire({
        title: "¡Advertencia!",
        text: "No se puede acceder a este sitio web",
        imageUrl: "img/rcyt.png",
        imageWidth: 300,
        imageAlt: "",
        icon: "warning"
    });
}
    function mensaje3(){
        Swal.fire({
            title: "Cancelado",
            text: "Cancelaste esta acción",
            icon: "error"
        });
    }
    function mensaje4(){
        Swal.fire({
            title: "Reciclado",
            text: "Se enviaron los elementos a la papelera",
            icon: "info"
        });
    }
    function mensaje5(){
        Swal.fire({
            title: "¿Confirmar ingreso?",
            text: "¿Estás seguro de que deseas ingresar?",
            icon: "question"
        });
    }
    function mensaje6(){
        Swal.fire({
            title: "Huella digital",
            text: "Escaneando huella dactilar...",
            icon: "info"
        });
    }
    function mensaje7(){
        Swal.fire({
            title: "Ingresar clave",
            text: "Introduce tu contraseña",
            icon: "question"
        });
    }
    function mensaje8(){
        Swal.fire({
            title: "incógnito",
            text: "Estas en modo incógnito, tu actividad no será registrada",
            icon: "info"
        });
    }
    function mensaje9(){
        Swal.fire({
            title: "Filtrar resultados",
            text: "buscando...",
            imageUrl: "img/perrito.jpg",
        imageWidth: 300,
        imageAlt: "",
            icon: "info"
        });
    }
    function mensaje10(){
        Swal.fire({
            title: "Limpiar búsqueda",
            text: "Se ha limpiado la información de las búsquedas anteriores",
            imageUrl: "img/BAELA.jpeg",
        imageWidth: 300,
        imageAlt: "",
            icon: "warning"
        });
    }
</script>

</body>
</html>
