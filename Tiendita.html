<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
  <title>Tiendita</title>
</head>
<body>
    <nav class="navbar bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand text-white" href="index.html">
                <img src="img/Piano.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                Tiendita
            </a>
        </div>
    </nav>

    <div class="container p-4 bg-inverse mt-5 card">
        <h1 class="text-center fg-black">TIENDITA</h1> <hr>
        <button type="button" class="btn btn-danger w-25" style="background-color: #dc3545 !important; color: white !important; border: none !important;" onclick="document.getElementById('addProducto').showModal()">
            <i class="bi bi-cart4"></i>Agregar
        </button>
        <table class="table table-striped table-hover mt-3">
            <tr>
                <td>PRODUCTO</td>
                <td>PRECIO</td>
                <td>CALIDAD</td>
                <td>IMPORTE</td>
                <td></td>
            </tr>
            ..<tbody id="productos">
..............</tbody>

            <tr>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
        </table>
    </div>

    <dialog class="dialog p-4 rounded border-0 shadow" id="addProducto">
        <div class="dialog-header d-flex justify-content-between align-items-center mb-3">
            <h1 class="dialog-title m-0">AGREGAR PRODUCTO</h1>
            <button type="button" class="btn-close" style="background-color: #28a745 !important; color: white !important; border: none !important;" onclick="document.getElementById('addProducto').close()" aria-label="Close"></button>
        </div>
        <div class="dialog-body mb-3">
            <h3>NOMBRE</h3>
            <input type="text" id="nombre" class="form-control mb-3">
            <h3>PRECIO</h3>
            <input type="text" id="precio" class="form-control">
        </div>
        <div class="dialog-footer d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-danger" style="background-color: #dc3545 !important; color: white !important; border: none !important;"onclick="document.getElementById('addProducto').close()"><i class="bi bi-x-circle-fill"></i>Cancelar</button>
            <button type="button" class="btn btn-success"style="background-color: #green !important; color: white !important; border: none !important;" id="btnSave"><i class="bi bi-save"></i>Guardar</button>
        </div>
    </dialog>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/sweetalert2.all.min.js"></script>
    <script src="Tiendita.js"></script>
</body>
</html>
