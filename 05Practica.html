<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="estilos.css">
    <title>PRACTICAS JAVASCRIPT</title>
</head>
<body onload="calcular()">
    <nav class="navbar bg-primary navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="img/Liverpool.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                PRACTICAS JAVASCRIPT
            </a>    
        </div>
    </nav>

    <div class="container p-4 mt-5 card border-0 text-white" style="background-color: #FF5252;">
        <h1 class="text-center">CREDICOOPEL</h1>
        <hr>
        <div class="row align-items-center">
            <div class="col-md-6">
                <h5>Producto:</h5>
                <select id="producto" class="form-select mb-3" onchange="calcular()">
                    <option value="Bolsa">Bolsa</option>
                    <option value="Reloj">Reloj</option>
                    <option value="Perfume">Perfume</option>
                    <option value="Piano">Piano</option>
                    <option value="Sala">Sala</option>
                </select>

                <h5>Plazo:</h5>
                <div class="mb-3">
                    <input type="radio" name="plazo" id="uno" onchange="calcular()" checked> 6 Meses (+10%) <br>
                    <input type="radio" name="plazo" id="dos" onchange="calcular()"> 12 Meses (+15%) <br>
                    <input type="radio" name="plazo" id="tres" onchange="calcular()"> 18 Meses (+20%) <br>
                </div>

                <h5>Cantidad:</h5>
                <input type="number" value="1" min="1" max="10" id="cantidad" class="form-control mb-3" onchange="calcular()">

                <div id="contado" class="fw-bold mt-2">Precio de Contado: $ 0.00 MXN</div>
                <div id="credito" class="fw-bold">Precio a Crédito: $ 0.00 MXN</div>
                <div id="abono" class="fw-bold">Abono Mensual: $ 0.00 MXN</div>
            </div>

            <div class="col-md-6 text-center mt-3 mt-md-0">
                <div id="img"></div>
                <div id="precio" class="fw-bold mt-2 fs-5">Precio: $ 0.00 MXN</div>
            </div>
        </div>
    </div>

    <script src="js/credicopel.js"></script>
</body>
</html>
