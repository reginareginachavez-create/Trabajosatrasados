<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <a href="Index.html"> Volver al menu de practicas atrasadas</a>
    <title>PRACTICAS JAVASCRIPT</title>

</head>
<body>
    <nav class="navbar bg-primary navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="img/OIP.jpg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                PRACTICAS JAVASCRIPT
            </a>
        </div>
    </nav>

    <div class="container p-4 bg-info mt-5 card">
        <h1 class="text-center">SIGNOS ZODIACALES</h1>
        <hr>
        <div class="row align-items-center">
            <div class="col-md-6">
                <h5 id="valorDia">DIA 1</h5>
                <input type="range" id="dia" class="form-range" min="1" max="31" value="1"> 
                <br><br>
                <h5>MES</h5>
                <select class="form-select" id="mes">
                    <option value="ENERO">Enero</option>
                    <option value="FEBRERO">Febrero</option>
                    <option value="MARZO">Marzo</option>
                    <option value="ABRIL">Abril</option>
                    <option value="MAYO">Mayo</option>
                    <option value="JUNIO">Junio</option>
                    <option value="JULIO">Julio</option>
                    <option value="AGOSTO">Agosto</option>
                    <option value="SEPTIEMBRE">Septiembre</option>
                    <option value="OCTUBRE">Octubre</option>
                    <option value="NOVIEMBRE">Noviembre</option>
                    <option value="DICIEMBRE">Diciembre</option>
                </select>
                <h2 id="fecha" class="text-center mt-4">FECHA</h2>
                <button class="btn btn-warning mt-3 w-100 fw-bold" id="reset">RESET</button>
            </div>
            <div class="col-md-6 text-center mt-3 mt-md-0">
                <img src="img/zodiaco.png" id="signo" class="img-fluid rounded shadow" alt="Signo Zodiacal">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
