<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas de multiplicar</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="p-3">
   
    <nav class="navbar navbar-dark" style="background-color: #990000;">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="img/OIP.jpg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                PRACTICAS JAVASCRIPT
            </a>
        </div>
    </nav>
    <h2 class="text-center text-nowrap mb-4">Tablas de Multiplicar</h2>

    <div class="mx-auto text-center mb-4" style="max-width: 300px;">
        <input type="range" class="form-range" id="numero" min="1" max="10" value="1">
        <label for="numero" class="form-label fw-bold d-block my-2">
            Selecciona un número: <span id="valNumero">1</span>
        </label>
        
        <button type="button" id="btnReset" class="btn btn-secondary btn-sm">
            RESET
        </button>
    </div>

    <div id="resultado" class="text-start"></div>

    <script src="js/bootstrap.bundle.min.js"></script>
     <script src="js/sweetalert2.all.min.js"></script>
    <script src="tablasdemultipicar.js"></script>
</body>
</html>
