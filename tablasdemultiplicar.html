<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas de multiplicar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    
    
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <center>
        <h1>Tablas de multiplicar</h1>
        <table width="100%" border="1">
            <tr>
                <td>
                    <h3>Numero 1</h3>
                    <input type="range" id="numero1" min="1" max="100" value="1" oninput="calcular()">
                    <span id="vb">1</span><br>
                    <h3>Numero 2</h3>
                    <input type="range" id="numero2" min="1" max="100" value="1" oninput="calcular()">
                    <span id="va">1</span><br>
                    <button onclick="reset()"><i class="bi bi-bootstrap-reboot"></i> RESET</button>
                </td>
                <td>
                    <h1>RESULTADO</h1>
                    <h2 id="resultado">0</h2>
                </td>
            </tr>
        </table>
    </center>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/sweetalert2.all.min.js"></script>
    <script src="tablasdemultiplicar.js"></script>
</body>
</html>
