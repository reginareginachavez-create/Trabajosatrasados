<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="p-3">
    <nav class="navbar bg-primary navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="img/image.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                PRACTICAS JAVASCRIPT
            </a>    
        </div>
    </nav>

    <div class="container text-center" style="max-width: 300px;">
        <h3>Calculadora de IMC</h3>
        
        <label class="form-label fw-bold mt-2">Peso: <span id="vpeso">62</span> Kg</label>
        <input type="range" class="form-range" id="peso" min="30" max="150" value="62">

        <label class="form-label fw-bold mt-2">Altura: <span id="valtura">1.70</span> m</label>
        <input type="range" class="form-range" id="altura" min="120" max="220" value="170">

        <button type="button" onclick="reiniciar()" class="btn btn-secondary btn-sm my-3">Reset</button>

        <div class="bg-dark text-white p-2 mb-3">
            IMC: <strong id="imc">21.45</strong> kg/m<sup>2</sup>
        </div>
    </div>

    <div class="mx-auto text-center text-white fw-bold fs-4" style="max-width: 850px;">
        <div id="imc1" class="p-3" style="background: #0099ff;">Bajo peso (&lt; 18.5)</div>
        <div id="imc2" class="p-3" style="background: #7ac943;">Normal (18.5 - 24.9)</div>
        <div id="imc3" class="p-3" style="background: #ffcc00;">Sobrepeso (25 - 29.9)</div>
        <div id="imc4" class="p-3" style="background: #ff9900;">Obesidad I (30 - 34.9)</div>
        <div id="imc5" class="p-3" style="background: #ff6600;">Obesidad II (35 - 39.9)</div>
        <div id="imc6" class="p-3" style="background: #ff3300;">Obesidad III (&ge; 40)</div>
    </div>
    <center>
        <img src="img/image.png" alt="">
    </center>

    <script src="imc.js"></script>
</body>
</html>
