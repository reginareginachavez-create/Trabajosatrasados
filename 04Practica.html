<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <title>SALARIO NETO</title>
</head>
<body onload="calcularSalarioNeto()">
    <nav class="navbar bg-primary navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="img/Pesos.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                PRACTICAS JAVASCRIPT
            </a>    
        </div>
    </nav>

    <div class="container p-4 bg-info mt-5 card text-center">
        <div class="display-2 mb-4">SALARIO NETO</div>
        <table class="table">
            <tr>
                <td>Puesto</td>
                <td>Horas</td>
                <td>Años</td>
            </tr>
            <tr>
                <td>
                    <select id="puesto" class="form-control" onchange="calcularSalarioNeto()">
                        <option value="1">Gerente</option>
                        <option value="2">Secretaria</option>
                        <option value="3">Cajero</option>
                        <option value="4">Supervisor</option>
                    </select>
                </td>
                <td>
                    <select id="horas" class="form-control" onchange="calcularSalarioNeto()">
                        <script>
                            for (var i = 0; i <= 50; i++) {
                                document.write("<option value='" + i + "'>" + i + "</option>");
                            }
                        </script>
                    </select>
                </td>
                <td>
                    <select id="anios" class="form-control" onchange="calcularSalarioNeto()">
                        <script>
                            for (var i = 0; i <= 50; i++) {
                                document.write("<option value='" + i + "'>" + i + "</option>");
                            }
                        </script>
                    </select>
                </td>
            </tr>
        </table>

        <table class="table mt-4">
            <tr>
                <td colspan="2"><h2>PERCEPCIONES</h2></td>
                <td colspan="2"><h2>DEDUCCIONES</h2></td>
            </tr>
            <tr>
                <td>Sueldo base</td>
                <td><span id="sueldoBase"></span></td>
                <td>ISR</td>
                <td><span id="ISR"></span></td>
            </tr>
            <tr>
                <td>Canasta básica</td>
                <td><span id="canastaBasica"></span></td>
                <td>Servicio de Salud</td>
                <td><span id="ServicioSalud"></span></td>
            </tr>
            <tr>
                <td>Apoyo</td>
                <td><span id="apoyo"></span></td>
                <td>AFORE</td>
                <td><span id="AFORE"></span></td>
            </tr>
            <tr>
                <td>Antigüedad</td>
                <td><span id="antiguedad"></span></td>
                <td>Sindicato</td>
                <td><span id="sindicato"></span></td>
            </tr>
            <tr>
                <td>Estímulo</td>
                <td><span id="estimulo"></span></td>
                <td>Deducción Extra</td>
                <td><span id="deduccionExtra"></span></td>
            </tr>
            <tr>
                <td>Bono General</td>
                <td><span id="bonoGeneral"></span></td>
                <td>Otras Deducciones</td>
                <td><span id="otrasDeducciones"></span></td>
            </tr>
            <tr>
                <td><h4>TOTAL PERCEPCIONES</h4></td>
                <td><span id="totalPercepciones"></span></td>
                <td><h4>TOTAL DEDUCCIONES</h4></td>
                <td><span id="totalDeducciones"></span></td>
            </tr>
            <tr>
                <td colspan="2"><h4>SALARIO NETO</h4></td>
                <td colspan="2"><span id="salarioNeto"></span></td>
            </tr>
        </table>
    </div>

    <script src="js/04app.js"></script>
</body>
</html>
